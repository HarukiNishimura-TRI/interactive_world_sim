# DP Demo dataset config for IWS training — Robomimic Can
# Uses success-only expert demonstrations from the DP training set.
defaults:
  - base_dataset

_name: dp_demo_dataset

# Path to the DP expert demo HDF5 (success-only demos)
dataset_path: /workspace/data/robomimic/datasets/can/ph/image.hdf5
horizon: 3  # original-codebase default from latent_world_model
val_horizon: 200  # upstream default for Stage 2/3 validation diagnostics
n_obs_steps: 2
n_action_steps: 8
max_steps: 400
resolution: 84
seed: 42
val_ratio: 0.1
pad_before: 1
pad_after: 1

obs_keys: [agentview_image, robot0_eye_in_hand_image]
low_dim_keys: [robot0_eef_pos, robot0_eef_quat, robot0_gripper_qpos]

shape_meta:
  action:
    shape:
    - 7  # 7-DOF action (robomimic)
  obs:
    agentview_image:
      shape: [3, 84, 84]
      type: rgb
    robot0_eye_in_hand_image:
      shape: [3, 84, 84]
      type: rgb
    robot0_eef_pos:
      shape: [3]
      type: low_dim
    robot0_eef_quat:
      shape: [4]
      type: low_dim
    robot0_gripper_qpos:
      shape: [2]
      type: low_dim
