# DP Demo dataset config for IWS training — Robomimic Transport
defaults:
  - base_dataset

_name: dp_demo_dataset

dataset_path: /workspace/data/robomimic/datasets/transport/ph/image.hdf5
horizon: 3  # original-codebase default
val_horizon: 200  # upstream default for Stage 2/3 validation diagnostics
n_obs_steps: 2
n_action_steps: 8
max_steps: 400
resolution: 84
seed: 42
val_ratio: 0.1
pad_before: 1
pad_after: 1

obs_keys: [shouldercamera0_image, shouldercamera1_image, robot0_eye_in_hand_image, robot1_eye_in_hand_image]
low_dim_keys: [robot0_eef_pos, robot0_eef_quat, robot0_gripper_qpos, robot1_eef_pos, robot1_eef_quat, robot1_gripper_qpos]

shape_meta:
  action:
    shape:
    - 14  # 14-DOF action (transport: 2 robots × 7)
  obs:
    shouldercamera0_image:
      shape: [3, 84, 84]
      type: rgb
    shouldercamera1_image:
      shape: [3, 84, 84]
      type: rgb
    robot0_eye_in_hand_image:
      shape: [3, 84, 84]
      type: rgb
    robot1_eye_in_hand_image:
      shape: [3, 84, 84]
      type: rgb
    robot0_eef_pos:
      shape: [3]
      type: low_dim
    robot0_eef_quat:
      shape: [4]
      type: low_dim
    robot0_gripper_qpos:
      shape: [2]
      type: low_dim
    robot1_eef_pos:
      shape: [3]
      type: low_dim
    robot1_eef_quat:
      shape: [4]
      type: low_dim
    robot1_gripper_qpos:
      shape: [2]
      type: low_dim
