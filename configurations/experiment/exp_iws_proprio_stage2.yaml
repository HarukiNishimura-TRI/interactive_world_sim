# IWS Stage 2: Dynamics + Proprio Head Training
# Trains latent dynamics model + proprioceptive prediction heads.
# Requires a Stage 1 autoencoder checkpoint (algorithm.load_ae).
# Original-codebase defaults from upstream IWS README.
defaults:
  - base_pytorch

tasks: [training]
training:
  lr: 8e-5  # original-codebase default
  precision: 32-true
  batch_size: 16
  max_epochs: -1
  max_steps: 200000
  log_every_n_steps: 1000  # original-codebase default
  checkpointing:
    every_n_train_steps: 25000
    save_last: True  # enables checkpoints/last.ckpt for stage handoff
  optim:
    gradient_clip_val: 1.0
  data:
    num_workers: 16

validation:
  val_every_n_step: 10000
  val_every_n_epoch: null
  batch_size: 16
  limit_batch: 8

test:
  limit_batch: 1
  batch_size: 8

logging:
  metrics:
    - fvd
