# IWS Stage 1: Autoencoder Training
# Trains encoder + diffusion decoder to compress RGB observations into compact latent space.
# Original-codebase defaults from upstream IWS README.
defaults:
  - base_pytorch

tasks: [training]
training:
  lr: 8e-5  # original-codebase default
  precision: 32-true
  batch_size: 1  # original-codebase default for Stage 1
  max_epochs: -1
  max_steps: 1000005  # original-codebase default
  log_every_n_steps: 100  # original-codebase default
  checkpointing:
    every_n_train_steps: 10000  # original-codebase default
    save_last: True  # enables checkpoints/last.ckpt for stage handoff
  optim:
    gradient_clip_val: 1.0
  data:
    num_workers: 8

validation:
  val_every_n_step: 6000  # original-codebase default for Stage 1
  val_every_n_epoch: null
  batch_size: 10  # original-codebase default for Stage 1
  limit_batch: 1.0  # original-codebase default (full validation set)

test:
  limit_batch: 1
  batch_size: 8

logging:
  metrics:
    - fvd
